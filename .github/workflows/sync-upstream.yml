name: Sync Upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: komari-monitor/komari-web
  UPSTREAM_BRANCH: radix
  BASE_BRANCH: radix
  SYNC_BRANCH: sync/upstream-radix
  PR_TITLE: "chore: sync komari-monitor/komari-web radix"

jobs:
  prepare-sync-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.BASE_BRANCH }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Merge upstream into a review branch
        id: sync
        run: |
          set -euo pipefail
          git config user.name "cazi-upstream-sync"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${UPSTREAM_BRANCH}"
          git fetch --no-tags origin "${BASE_BRANCH}"

          if git merge-base --is-ancestor "upstream/${UPSTREAM_BRANCH}" "origin/${BASE_BRANCH}"; then
            {
              echo "needed=false"
              echo "ready=false"
              echo "conflict=false"
            } >> "$GITHUB_OUTPUT"
            echo "The fork already contains the current upstream branch." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git checkout -B "${SYNC_BRANCH}" "origin/${BASE_BRANCH}"
          set +e
          git merge --no-edit "upstream/${UPSTREAM_BRANCH}"
          merge_status=$?
          set -e

          if [ "$merge_status" -ne 0 ]; then
            conflict_files="$(git diff --name-only --diff-filter=U)"
            git merge --abort
            {
              echo "# Upstream sync requires manual resolution"
              echo
              echo "- Upstream: \`${UPSTREAM_REPOSITORY}:${UPSTREAM_BRANCH}\`"
              echo "- Base: \`${GITHUB_REPOSITORY}:${BASE_BRANCH}\`"
              echo "- Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
              echo
              echo "## Conflicting files"
              echo
              echo '```text'
              echo "$conflict_files"
              echo '```'
              echo
              echo "Do not merge this report-only commit. Resolve the upstream merge on this branch, delete this file, run the repository tests, and then update the pull request."
            } > .github/UPSTREAM_SYNC_CONFLICTS.md
            git add .github/UPSTREAM_SYNC_CONFLICTS.md
            git commit -m "chore: record upstream merge conflicts"
            git push --force-with-lease origin "${SYNC_BRANCH}"
            {
              echo "needed=true"
              echo "ready=false"
              echo "conflict=true"
              echo "conflict_files<<EOF"
              echo "$conflict_files"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            {
              echo "## Upstream sync requires manual conflict resolution"
              echo
              echo '```text'
              echo "$conflict_files"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          protected_changes="$(git diff --name-only "origin/${BASE_BRANCH}..HEAD" -- \
            .github/scripts/resolve-komari-release.cjs \
            .github/scripts/resolve-komari-release.test.cjs \
            .github/workflows/follow-komari-release.yaml \
            .github/workflows/release-automation-tests.yml \
            .github/workflows/sync-upstream.yml)"
          node --test .github/scripts/resolve-komari-release.test.cjs
          npm ci
          npm run build
          git push --force-with-lease origin "${SYNC_BRANCH}"
          {
            echo "needed=true"
            echo "ready=true"
            echo "conflict=false"
            echo "protected_changes<<EOF"
            echo "$protected_changes"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$protected_changes" ]; then
            {
              echo "## Fork-owned release automation changed"
              echo
              echo '```text'
              echo "$protected_changes"
              echo '```'
              echo
              echo "Review these files manually and require the Test Release Automation check before merging."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or update the review pull request
        if: steps.sync.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PROTECTED_CHANGES: ${{ steps.sync.outputs.protected_changes }}
        run: |
          set -euo pipefail
          body="$(cat <<'EOF'
          Automated upstream merge. Review the fork-owned agent distribution, TCP quality administration and release automation before merging.

          Required checks:
          - Build the web package.
          - Run the release resolver regression tests.
          - Review every fork-owned automation file listed below.
          EOF
          )"
          if [ -n "${PROTECTED_CHANGES}" ]; then
            body="${body}

          Fork-owned automation changed:

          \`\`\`text
          ${PROTECTED_CHANGES}
          \`\`\`"
          fi
          if gh pr view "${SYNC_BRANCH}" --repo "${GITHUB_REPOSITORY}" --json number >/dev/null 2>&1; then
            gh pr edit "${SYNC_BRANCH}" --repo "${GITHUB_REPOSITORY}" --title "${PR_TITLE}" --body "$body"
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base "${BASE_BRANCH}" --head "${SYNC_BRANCH}" --title "${PR_TITLE}" --body "$body"
          fi

      - name: Create or update the conflict pull request
        if: steps.sync.outputs.conflict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="chore: resolve komari-monitor/komari-web upstream conflicts"
          body="The automated upstream merge found conflicts. This branch currently contains a conflict report only and must not be merged as-is. Resolve the merge on this branch, preserve the fork-owned release automation, delete the report, run all tests, and then update this pull request."
          if gh pr view "${SYNC_BRANCH}" --repo "${GITHUB_REPOSITORY}" --json number >/dev/null 2>&1; then
            gh pr edit "${SYNC_BRANCH}" --repo "${GITHUB_REPOSITORY}" --title "$title" --body "$body"
          else
            gh pr create --repo "${GITHUB_REPOSITORY}" --base "${BASE_BRANCH}" --head "${SYNC_BRANCH}" --title "$title" --body "$body"
          fi
